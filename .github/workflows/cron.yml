name: Push Notifications Cron

on:
  schedule:
    - cron: '*/5 * * * *' # Runs every 5 minutes
  workflow_dispatch: # Allows manual testing from the GitHub Actions tab

jobs:
  ping-api:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Railway API
        run: curl -s -X GET -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" "https://trackyourtime.up.railway.app/api/cron/push?interval=5"
